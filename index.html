    b.querySelectorAll('[data-hacc]').forEach(el=>el.addEventListener('click',()=>{const a=S.settings.accounts.find(x=>x.id===el.dataset.hacc);if(a)reconSheet(a)}));
    b.querySelectorAll('[data-hgo]').forEach(el=>el.addEventListener('click',()=>{const g=el.dataset.hgo;closeSheet();if(g==='ex')exSheet();else if(g==='bk')backup();else{S.tab='settings';render()}}));
    b.querySelectorAll('.list [data-tx]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();const t=txOf(el.dataset.m).find(x=>x.id===el.dataset.tx);if(t){closeSheet();setTimeout(()=>t.type==='adjust'?adjSheet(t):txSheet(t),50)}}));
  });
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length;
  const delim=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(f);f=''; if(row.some(x=>x.trim()!=='')) rows.push(row); row=[]; }
    else f+=ch;
  }
  row.push(f); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
function ymd(y,m,d){m=+m;d=+d;if(m<1||m>12||d<1||d>31)return null;return y+'-'+pad(m)+'-'+pad(d)}
function parseDate(s,fm){
  s=normNum(s).trim(); let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ymd(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return fm==='mdy'?ymd(y,m[1],m[2]):ymd(y,m[2],m[1])}
  const d=new Date(s); if(!isNaN(d)) return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return null;
}

async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined') throw new Error('nodecomp');
  const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}
async function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let eocd=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}

  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const files={}; const dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    files[name]={method,csize,off}; p+=46+nl+el+cl;
  }
  return {names:Object.keys(files),get:async name=>{const f=files[name];if(!f)return null;
    const lnl=dv.getUint16(f.off+26,true),lel=dv.getUint16(f.off+28,true),start=f.off+30+lnl+lel,data=u8.subarray(start,start+f.csize);
    return f.method===0?data:await inflateRaw(data)}};
}
async function readXlsx(z){
  const dec=new TextDecoder(),xml=async n=>{const b=await z.get(n);return b?new DOMParser().parseFromString(dec.decode(b),'application/xml'):null};
  const tags=(d,t)=>Array.from(d.getElementsByTagName(t));
  const ss=[]; const sd=await xml('xl/sharedStrings.xml');
  if(sd) tags(sd,'si').forEach(si=>ss.push(tags(si,'t').map(t=>t.textContent).join('')));
  const wb=await xml('xl/workbook.xml'), rel=await xml('xl/_rels/workbook.xml.rels'); const rmap={};
  if(rel) tags(rel,'Relationship').forEach(r=>rmap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const colIdx=ref=>{let c=0;for(const ch of ref.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
  const out={};
  for(const s of tags(wb,'sheet')){
    const rid=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let t=rmap[rid]||''; t=t.replace(/^\/?xl\//,''); t=t.startsWith('/')?t.slice(1):'xl/'+t;

      if(ty==='s') val=v?ss[+v.textContent]||'':''; else if(ty==='inlineStr') val=tags(c,'t').map(x=>x.textContent).join(''); else val=v?v.textContent:'';
      const ref=c.getAttribute('r'); arr[ref?colIdx(ref):arr.length]=val}); rows.push(Array.from(arr,x=>x==null?'':x))});
    out[s.getAttribute('name')]=rows;
  }
  return out;
}
function sheetObjs(rows){if(!rows||rows.length<2)return[];const h=rows[0];return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]==null?'':r[i]);return o})}
function budgetToBackup(sh){

  const sid=x=>String(x||'').replace(/_+defaultOwner_+$/,''), num=x=>{const v=parseFloat(String(x).replace(/,/g,''));return isNaN(v)?0:v};
  const tb=x=>x===true||x==='1'||String(x).toLowerCase()==='true';
  const base=(R[0]&&R[0].system_currency)||'KWD';
  const rate={}; rate[base]=1;

  Object.keys(tot).forEach(c=>{if(tot[c][1]>0)rate[c]=+(tot[c][0]/tot[c][1]).toFixed(6)});
  const rt=c=>rate[c]||(base==='KWD'?DEF_RATES[c]:0)||1;
  const col=x=>{x=String(x||'').trim().replace(/^#/,'');return /^[0-9a-f]{6}$/i.test(x)?'#'+x.toUpperCase():'#7F8C8D'};

  const cs=C.filter(c=>+c.status===0).concat(C.filter(c=>+c.status!==0));
  const categories=cs.map(c=>{const nm=String(c.name).trim(),inc=tb(c.is_income);return{id:sid(c.source_uid),name:nm,icon:emo(c.icon_name)?c.icon_name:guessIcon(nm,inc?'💰':'📌'),kind:inc?'income':'expense',budget:0,color:col(c.color_hex)}});
  const aCur={}; A.forEach(a=>aCur[sid(a.source_uid)]=a.currency||base);
  const inCur=(e,cur)=>e.original_currency===cur?num(e.original_amount):(e.Currency===cur?num(e.original_amount):num(e.system_amount)/rt(cur));
  const byId={}; T.forEach(t=>byId[sid(t.source_uid)]=t);
  const months={},adj={}; const put=t=>{(months[t.date.slice(0,7)]=months[t.date.slice(0,7)]||[]).push(t)};
  R.forEach(r=>{const typ=r.record_type==='income'||tb(r.is_income)?'income':'expense',amt=+num(r.system_amount).toFixed(3),date=d10(r.Date||r.occurred_at_utc);if(!date||!amt)return;
    const acc=r.account_id?sid(r.account_id):'', cur=acc?(aCur[acc]||base):base;
    let note=String(r.Note||r.note||'').trim(); if(r.subcategory_name) note=r.subcategory_name+(note?' – '+note:'');
    if(r.original_currency&&r.original_currency!==base&&r.original_currency!==cur) note=(note?note+' ':'')+'('+num(r.original_amount)+' '+r.original_currency+')';

    if(tb(t.is_income))return; const date=d10(t.Date||t.occurred_at_utc),amt=+num(t.system_amount).toFixed(3); if(!date||!amt)return;

    if(cur!==base) tx.oamt=+inCur(t,cur).toFixed(3);
    if(tc!==base) tx.toamt=+(cp?inCur(cp,tc):num(t.system_amount)/rt(tc)).toFixed(3);
    put(tx)});
  let accounts=A.map(a=>{const i=sid(a.source_uid),nm=String(a.name).trim(),credit=+a.account_type===0&&!/prepaid/i.test(nm);
    const opening=(credit?-num(a.liability):num(a.credit_limit))+(adj[i]||0);
    return{id:i,name:nm,icon:guessIcon(nm,credit?'💳':'🏦'),type:credit?'credit':'debit',currency:a.currency||base,opening:+opening.toFixed(3),limit:credit?num(a.credit_limit):0,color:col(a.color_hex)}}).reverse();

  const rates={}; Object.keys(rate).filter(c=>c!==base).forEach(c=>rates[c]=rate[c]); if(!rates.SAR&&accounts.some(a=>a.currency==='SAR')) rates.SAR=rt('SAR');

}
async function handleZip(u8){
  const z=await unzip(u8);
  if(z.names.includes('xl/workbook.xml')){
    const sh=await readXlsx(z);
    if(sh.Records&&sh.Accounts&&sh.Categories){restoreSheet(budgetToBackup(sh));return}
    const first=Object.values(sh)[0]; if(first&&first.length>1){importSheet(first);return}
    toast('ملف Excel فارغ');return;
  }
  const pick=z.names.find(n=>/\.xlsx$/i.test(n))||z.names.find(n=>/\.(json|txt)$/i.test(n))||z.names.find(n=>/\.csv$/i.test(n));
  if(!pick){toast('لم يُعثر على ملف مناسب داخل الملف المضغوط');return}
  const b=await z.get(pick); if(/\.xlsx$/i.test(pick)) return handleZip(b);
  handleText(new TextDecoder().decode(b));
}
function handleText(txt){
  txt=txt.replace(/^\uFEFF/,'');
  if(txt.trim().charAt(0)==='{'){let o=null;try{o=JSON.parse(txt)}catch(x){} restoreSheet(o)} else importSheet(txt);
}
$('#fileIn').addEventListener('change',async e=>{const f=e.target.files[0]; e.target.value=''; if(!f) return;

    if(u8[0]===0x50&&u8[1]===0x4B){toast('جاري قراءة الملف…');await handleZip(u8);return}
