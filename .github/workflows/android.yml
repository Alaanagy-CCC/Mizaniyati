            </application>
          </manifest>
          X

          cat > $A/res/xml/no_backup.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- لا نسخ سحابي ولا نقل من جهاز إلى جهاز لبيانات رُشد. النسخة الوحيدة: ملف مشفّر يصدّره المستخدم بنفسه. -->
          <data-extraction-rules>
            <cloud-backup>
              <exclude domain="root" path="." />
              <exclude domain="file" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="external" path="." />
            </cloud-backup>
            <device-transfer>
              <exclude domain="root" path="." />
              <exclude domain="file" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="external" path="." />
            </device-transfer>
          </data-extraction-rules>
          X

          cat > $A/res/values/styles.xml <<'X'
          <resources>
            <style name="AppTheme" parent="android:Theme.DeviceDefault.DayNight">
              <item name="android:windowActionBar">false</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#0F3F45</item>
            </style>
          </resources>
          X

          cat > $A/res/drawable/ic_salah.xml <<'X'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M14.5,2.5A9.5,9.5 0,1 0,21.5 18A7.5,7.5 0,1 1,14.5 2.5Z"/>
          </vector>
          X

          cat > $A/java/com/mizaniyati/app/PrayerReceiver.java <<'X'
          package com.mizaniyati.app;

          import android.Manifest;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.drawable.Icon;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class PrayerReceiver extends BroadcastReceiver {
            static final String ACT = "com.mizaniyati.app.PRAYER";
            static final String ACT_JAM = "com.mizaniyati.app.JAM";

            @Override
            public void onReceive(Context c, Intent i) {
              if (ACT_JAM.equals(i.getAction())) {
                String d = i.getStringExtra("d"), k = i.getStringExtra("k");
                if (d != null && k != null) {
                  SharedPreferences sp = c.getSharedPreferences("salah", Context.MODE_PRIVATE);
                  String cur = sp.getString("jam", ""), add = d + "|" + k;
                  if (!cur.contains(add)) sp.edit().putString("jam", cur.isEmpty() ? add : cur + "," + add).apply();
                }
                c.getSystemService(NotificationManager.class).cancel(i.getIntExtra("nid", 0));
                return;
              }
              if (ACT.equals(i.getAction())) {
                long t = i.getLongExtra("t", 0);
                String n = i.getStringExtra("n");
                if (n != null && Math.abs(System.currentTimeMillis() - t) < 15 * 60000L) show(c, n, t, i.getStringExtra("k"), i.getStringExtra("d"), i.getStringExtra("ti"));
              }
              scheduleNext(c);
            }

            static void show(Context c, String n, long t, String k, String d, String ti) {
              if (Build.VERSION.SDK_INT >= 33 && c.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return;
              NotificationManager nm = c.getSystemService(NotificationManager.class);
              NotificationChannel ch = new NotificationChannel("prayer", "مواقيت الصلاة", NotificationManager.IMPORTANCE_HIGH);
              ch.setDescription("تنبيه عند دخول وقت الصلاة");
              nm.createNotificationChannel(ch);
              Intent open = new Intent(c, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent pi = PendingIntent.getActivity(c, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              int nid = (int) (t / 60000L);
              Notification.Builder nb = new Notification.Builder(c, "prayer")
                  .setSmallIcon(R.drawable.ic_salah)
                  .setContentTitle(ti != null && !ti.isEmpty() ? ti : "حان الآن وقت صلاة " + n)
                  .setContentText("رُشد · مواقيت الصلاة")
                  .setWhen(t).setShowWhen(true)
                  .setAutoCancel(true)
                  .setCategory(Notification.CATEGORY_REMINDER)
                  .setContentIntent(pi);
              if (k != null && d != null && !k.isEmpty()) {
                Intent ji = new Intent(c, PrayerReceiver.class).setAction(ACT_JAM).putExtra("k", k).putExtra("d", d).putExtra("nid", nid);
                PendingIntent jp = PendingIntent.getBroadcast(c, nid, ji, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                nb.addAction(new Notification.Action.Builder(Icon.createWithResource(c, R.drawable.ic_salah), "صلّيت في جماعة ✓", jp).build());
              }
              nm.notify(nid, nb.build());
            }

            static void scheduleNext(Context c) {
              AlarmManager am = c.getSystemService(AlarmManager.class);
              long now = System.currentTimeMillis(), t = 0;
              String n = null, pk = "", pd = "", pt = "";
              try {
                JSONArray a = new JSONArray(c.getSharedPreferences("salah", Context.MODE_PRIVATE).getString("list", "[]"));
                for (int k = 0; k < a.length(); k++) {
                  JSONObject o = a.getJSONObject(k);
                  long x = o.getLong("t");
                  if (x > now + 1000 && (t == 0 || x < t)) { t = x; n = o.getString("n"); pk = o.optString("k"); pd = o.optString("d"); pt = o.optString("ti"); }
                }
              } catch (Exception e) { }
              Intent it = new Intent(c, PrayerReceiver.class).setAction(ACT).putExtra("t", t).putExtra("n", n).putExtra("k", pk).putExtra("d", pd).putExtra("ti", pt);
              PendingIntent pi = PendingIntent.getBroadcast(c, 7, it, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              if (t == 0) { am.cancel(pi); return; }
              if (Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms()) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
              else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
            }
          }
          X

          cat > $A/java/com/mizaniyati/app/HeadsetReceiver.java <<'X'
          package com.mizaniyati.app;

          import android.bluetooth.BluetoothClass;
          import android.bluetooth.BluetoothDevice;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          public class HeadsetReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              String a = i.getAction();
              if (a == null) return;
              try {
                BluetoothDevice d = i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE);
                if (d == null) return;
                BluetoothClass bc = d.getBluetoothClass();
                if (bc == null || bc.getMajorDeviceClass() != BluetoothClass.Device.Major.AUDIO_VIDEO) return;
                String t = BluetoothDevice.ACTION_ACL_CONNECTED.equals(a) ? "c" : "d";
                log(c, t, Integer.toHexString(String.valueOf(d.getAddress()).hashCode()));
              } catch (SecurityException e) { }
            }

            static synchronized void log(Context c, String t, String dev) {
              SharedPreferences sp = c.getSharedPreferences("audio", Context.MODE_PRIVATE);
              String v = sp.getString("log", "");
              v = (v.isEmpty() ? "" : v + ",") + t + "|" + System.currentTimeMillis() + "|" + dev;
              String[] parts = v.split(",");
              if (parts.length > 3000) {
                StringBuilder b = new StringBuilder();
                for (int k = parts.length - 3000; k < parts.length; k++) { if (b.length() > 0) b.append(','); b.append(parts[k]); }
                v = b.toString();
              }
              sp.edit().putString("log", v).apply();
            }
          }
          X

          cat > $A/java/com/mizaniyati/app/MainActivity.java <<'X'
          package com.mizaniyati.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AppOpsManager;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.health.connect.AggregateRecordsGroupedByPeriodResponse;
          import android.health.connect.AggregateRecordsRequest;
          import android.health.connect.HealthConnectException;
          import android.health.connect.HealthConnectManager;
          import android.health.connect.ReadRecordsRequestUsingFilters;
          import android.health.connect.ReadRecordsResponse;
          import android.health.connect.LocalTimeRangeFilter;
          import android.health.connect.TimeInstantRangeFilter;
          import android.health.connect.datatypes.ActiveCaloriesBurnedRecord;
          import android.health.connect.datatypes.AggregationType;
          import android.health.connect.datatypes.ExerciseSessionRecord;
          import android.health.connect.datatypes.ExerciseSessionType;
          import android.health.connect.datatypes.NutritionRecord;
          import android.health.connect.datatypes.SleepSessionRecord;
          import android.health.connect.datatypes.StepsRecord;
          import android.health.connect.datatypes.units.Energy;
          import android.hardware.GeomagneticField;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.location.Address;
          import android.media.AudioDeviceInfo;
          import android.media.AudioManager;
          import android.location.Geocoder;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.OutcomeReceiver;
          import android.provider.Settings;
          import android.view.Surface;
          import android.view.WindowManager;
          import android.database.Cursor;
          import java.security.MessageDigest;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.time.Instant;
          import java.time.LocalDate;
          import java.time.LocalDateTime;
          import java.time.Period;
          import java.time.ZoneId;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
            private static final int REQ_OPEN = 1, REQ_SAVE = 2, REQ_LOC = 3, REQ_NOTIF = 4, REQ_SLEEP = 5, REQ_BT = 6, REQ_SMS = 7;
            private String sharedText;
            /* رموز التحقق وكلمات المرور تُرفض هنا، فلا تصل إلى واجهة التطبيق أبداً */
            private static final java.util.regex.Pattern OTP = java.util.regex.Pattern.compile("(?i)otp|one[- ]?time|verification|passcode|password|\\bpin\\b|\\bcode\\b|رمز|كلمة (السر|المرور)|التحقق");
            private static final java.util.regex.Pattern MONEY = java.util.regex.Pattern.compile("(?i)(KWD|USD|SAR|AED|EUR|GBP|EGP|QAR|BHD|OMR|KD|د\\.ك|دينار)\\s*[0-9]");
            private static final String SLEEP_PERM = "android.permission.health.READ_SLEEP";
            private static final String[] HEALTH_PERMS = {SLEEP_PERM, "android.permission.health.READ_STEPS", "android.permission.health.READ_EXERCISE", "android.permission.health.READ_ACTIVE_CALORIES_BURNED", "android.permission.health.READ_NUTRITION"};
            private WebView web;
            private ValueCallback<Uri[]> fileCb;
            private String pendingText;
            private SensorManager sm;
            private boolean compassOn, locDone;
            private float decl;
            private long lastHead;
            private final SensorEventListener sensL = new SensorEventListener() {
              final float[] rm = new float[9], om = new float[9], ori = new float[3];

              @Override
              public void onSensorChanged(SensorEvent e) {
                if (e.sensor.getType() != Sensor.TYPE_ROTATION_VECTOR) return;
                long now = System.currentTimeMillis();
                if (now - lastHead < 50) return;
                lastHead = now;
                SensorManager.getRotationMatrixFromVector(rm, e.values);
                float[] m = rm;
                int r = getWindowManager().getDefaultDisplay().getRotation();
                if (r == Surface.ROTATION_90) { SensorManager.remapCoordinateSystem(rm, SensorManager.AXIS_Y, SensorManager.AXIS_MINUS_X, om); m = om; }
                else if (r == Surface.ROTATION_180) { SensorManager.remapCoordinateSystem(rm, SensorManager.AXIS_MINUS_X, SensorManager.AXIS_MINUS_Y, om); m = om; }
                else if (r == Surface.ROTATION_270) { SensorManager.remapCoordinateSystem(rm, SensorManager.AXIS_MINUS_Y, SensorManager.AXIS_X, om); m = om; }
                SensorManager.getOrientation(m, ori);
                double az = Math.toDegrees(ori[0]) + decl;
                az = ((az % 360) + 360) % 360;
                js(String.format(Locale.US, "window.__slhHead&&__slhHead(%.1f)", az));
              }

              @Override
              public void onAccuracyChanged(Sensor s, int a) {
                if (s.getType() == Sensor.TYPE_MAGNETIC_FIELD) js("window.__slhAcc&&__slhAcc(" + a + ")");
              }
            };

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              /* لا لقطات شاشة ولا تسجيل، ولا معاينة للمحتوى في قائمة التطبيقات المفتوحة */
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              getWindow().setStatusBarColor(Color.parseColor("#0F3F45"));
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("file".equals(u.getScheme())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  try { startActivityForResult(Intent.createChooser(i, "اختر ملفاً"), REQ_OPEN); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              web.addJavascriptInterface(new Bridge(), "AndroidBridge");
              web.loadUrl("file:///android_asset/index.html");
              takeShare(getIntent());
            }

            @Override
            protected void onNewIntent(Intent i) {
              super.onNewIntent(i);
              setIntent(i);
              if (takeShare(i)) js("window.__smsShared&&__smsShared()");
            }

            private boolean takeShare(Intent i) {
              if (i == null || !Intent.ACTION_SEND.equals(i.getAction())) return false;
              String t = i.getStringExtra(Intent.EXTRA_TEXT);
              if (t == null || t.isEmpty()) return false;
              sharedText = OTP.matcher(t).find() ? "" : t;
              return true;
            }

            @Override
            protected void onPause() { super.onPause(); unregCompass(); if (web != null) web.onPause(); }

            @Override
            protected void onResume() { super.onResume(); if (compassOn) regCompass(); if (web != null) { web.onResume(); js("window.__resumed&&__resumed()"); } }

            class Bridge {
              @JavascriptInterface
              public boolean canAuth() {
                KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                return km != null && km.isDeviceSecure();
              }

              @JavascriptInterface
              public void authenticate() {
                runOnUiThread(() -> {
                  try {
                    BiometricPrompt.Builder pb = new BiometricPrompt.Builder(MainActivity.this)
                        .setTitle("رُشد")
                        .setSubtitle("افتح التطبيق بالبصمة أو قفل الجهاز");
                    if (Build.VERSION.SDK_INT >= 30) {
                      pb.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK | BiometricManager.Authenticators.DEVICE_CREDENTIAL);
                    } else {
                      pb.setDeviceCredentialAllowed(true);
                    }
                    pb.build().authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {
                      @Override
                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) { js("window.__authOk&&__authOk()"); }
                      @Override
                      public void onAuthenticationError(int code, CharSequence msg) { js("window.__authFail&&__authFail()"); }
                    });
                  } catch (Exception e) {
                    js("window.__authFail&&__authFail()");
                  }
                });
              }

              @JavascriptInterface
              public void startCompass(final double lat, final double lon) {
                runOnUiThread(() -> {
                  decl = new GeomagneticField((float) lat, (float) lon, 0f, System.currentTimeMillis()).getDeclination();
                  compassOn = true;
                  regCompass();
                });
              }

              @JavascriptInterface
              public void stopCompass() {
                runOnUiThread(() -> { compassOn = false; unregCompass(); });
              }

              @JavascriptInterface
              public boolean hasLocPerm() { return locOk(); }

              @JavascriptInterface
              public void getLocation() {
