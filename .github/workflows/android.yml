            private static void addSpan(HashMap<String, Long> tot, String p, long a, long b, long lo, long hi) {
              long s = Math.max(a, lo), e = Math.min(b, hi);
              if (e > s) tot.merge(p, e - s, Long::sum);
            }

            private String usageJson(long start, long end) {
              if (!usageOk()) return "null";
              try {
                UsageStatsManager um = (UsageStatsManager) getSystemService(USAGE_STATS_SERVICE);
                long until = Math.min(end, System.currentTimeMillis());
                if (until <= start) return "{\"total\":0,\"apps\":{}}";
                UsageEvents ev = um.queryEvents(start - 6 * 3600000L, until);
                HashMap<String, Long> tot = new HashMap<>(), svc = new HashMap<>(), svcStart = new HashMap<>();
                HashMap<String, Integer> svcN = new HashMap<>();
                String fg = null;
                long fs = 0;
                UsageEvents.Event e = new UsageEvents.Event();
                while (ev.hasNextEvent()) {
                  ev.getNextEvent(e);
                  int t = e.getEventType();
                  long ts = e.getTimeStamp();
                  String p = e.getPackageName();
                  if (t == UsageEvents.Event.ACTIVITY_RESUMED) {
                    if (fg != null) addSpan(tot, fg, fs, ts, start, until);
                    fg = p; fs = ts;
                  } else if (t == UsageEvents.Event.ACTIVITY_PAUSED) {
                    if (fg != null && fg.equals(p)) { addSpan(tot, fg, fs, ts, start, until); fg = null; }
                  } else if (t == UsageEvents.Event.SCREEN_NON_INTERACTIVE || t == UsageEvents.Event.DEVICE_SHUTDOWN) {
                    if (fg != null) { addSpan(tot, fg, fs, ts, start, until); fg = null; }
                    if (t == UsageEvents.Event.DEVICE_SHUTDOWN) {
                      for (Map.Entry<String, Long> en : svcStart.entrySet()) addSpan(svc, en.getKey(), en.getValue(), ts, start, until);
                      svcStart.clear(); svcN.clear();
                    }
                  } else if (t == UsageEvents.Event.FOREGROUND_SERVICE_START) {
                    int n = svcN.getOrDefault(p, 0);
                    if (n == 0) svcStart.put(p, ts);
                    svcN.put(p, n + 1);
                  } else if (t == UsageEvents.Event.FOREGROUND_SERVICE_STOP) {
                    int n = svcN.getOrDefault(p, 0);
                    if (n > 0) {
                      if (n == 1) { Long st = svcStart.remove(p); if (st != null) addSpan(svc, p, st, ts, start, until); svcN.remove(p); }
                      else svcN.put(p, n - 1);
                    }
                  }
                }
                if (fg != null) addSpan(tot, fg, fs, until, start, until);
                for (Map.Entry<String, Long> en : svcStart.entrySet()) addSpan(svc, en.getKey(), en.getValue(), until, start, until);
                JSONObject sv = new JSONObject();
                for (Map.Entry<String, Long> en : svc.entrySet()) if (en.getValue() >= 60000) sv.put(en.getKey(), en.getValue());
                String home = homePkg();
                PackageManager pm = getPackageManager();
                JSONObject apps = new JSONObject();
                long total = 0;
                for (Map.Entry<String, Long> en : tot.entrySet()) {
                  String p = en.getKey();
                  long ms = en.getValue();
                  if (p.equals(home) || p.equals("com.android.systemui")) continue;
                  total += ms;
                  if (ms < 60000) continue;
                  String lbl = p;
                  try { lbl = pm.getApplicationLabel(pm.getApplicationInfo(p, 0)).toString(); } catch (Exception x) { }
                  apps.put(p, new JSONArray().put(lbl).put(ms));
                }
                return new JSONObject().put("total", total).put("apps", apps).put("svc", sv).toString();
              } catch (Exception x) {
                return "null";
              }
            }

