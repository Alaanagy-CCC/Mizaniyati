            private void fetchLocation() {
              final LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);
              if (lm == null || !lm.isLocationEnabled()) { js("window.__slhLocErr&&__slhLocErr('off')"); return; }
              Location best = null;
              for (String p : lm.getProviders(true)) {
                try {
                  Location l = lm.getLastKnownLocation(p);
                  if (l != null && (best == null || l.getTime() > best.getTime())) best = l;
                } catch (SecurityException e) { }
              }
              final boolean hadLast = best != null && System.currentTimeMillis() - best.getTime() < 3600000L;
              if (hadLast) sendLoc(best);
              String prov;
              if (Build.VERSION.SDK_INT >= 31 && lm.hasProvider(LocationManager.FUSED_PROVIDER)) prov = LocationManager.FUSED_PROVIDER;
              else if (lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) prov = LocationManager.NETWORK_PROVIDER;
              else prov = LocationManager.GPS_PROVIDER;
              locDone = false;
              final Handler h = new Handler(Looper.getMainLooper());
              final Runnable timeout = () -> {
                if (locDone) return;
                locDone = true;
                if (!hadLast) js("window.__slhLocErr&&__slhLocErr('none')");
              };
              h.postDelayed(timeout, 30000);
              try {
                if (Build.VERSION.SDK_INT >= 30) {
                  lm.getCurrentLocation(prov, null, getMainExecutor(), l -> {
                    if (locDone) return;
                    locDone = true;
                    h.removeCallbacks(timeout);
                    if (l != null) sendLoc(l);
                    else if (!hadLast) js("window.__slhLocErr&&__slhLocErr('none')");
                  });
                } else {
                  lm.requestSingleUpdate(prov, new LocationListener() {
                    @Override
                    public void onLocationChanged(Location l) {
                      if (locDone) return;
                      locDone = true;
                      h.removeCallbacks(timeout);
                      sendLoc(l);
                    }
                    @Override public void onStatusChanged(String p, int s, Bundle b) { }
                    @Override public void onProviderEnabled(String p) { }
                    @Override public void onProviderDisabled(String p) { }
                  }, Looper.getMainLooper());
                }
              } catch (SecurityException e) {
                js("window.__slhLocErr&&__slhLocErr('denied')");
              }
            }

            private void sendLoc(Location l) {
              final double lat = l.getLatitude(), lon = l.getLongitude();
              js(String.format(Locale.US, "window.__slhLoc&&__slhLoc(%.6f,%.6f,'','')", lat, lon));
              new Thread(() -> {
                String cc = "", city = "";
                try {
                  List<Address> a = new Geocoder(MainActivity.this, new Locale("ar")).getFromLocation(lat, lon, 1);
                  if (a != null && !a.isEmpty()) {
                    Address ad = a.get(0);
                    if (ad.getCountryCode() != null) cc = ad.getCountryCode();
                    city = ad.getLocality() != null ? ad.getLocality() : ad.getSubAdminArea() != null ? ad.getSubAdminArea() : ad.getAdminArea() != null ? ad.getAdminArea() : "";
                  }
                } catch (Exception e) { }
                if (cc.isEmpty()) return;
                final String code = String.format(Locale.US, "window.__slhLoc&&__slhLoc(%.6f,%.6f,%s,%s)", lat, lon, JSONObject.quote(cc), JSONObject.quote(city));
                runOnUiThread(() -> js(code));
              }).start();
            }

            @Override
            public void onRequestPermissionsResult(int req, String[] perms, int[] res) {
              super.onRequestPermissionsResult(req, perms, res);
              boolean ok = false;
              for (int x : res) if (x == PackageManager.PERMISSION_GRANTED) ok = true;
              if (req == REQ_LOC) {
                if (ok) fetchLocation();
                else js("window.__slhLocErr&&__slhLocErr('denied')");
              } else if (req == REQ_NOTIF) {
                js("window.__slhNotif&&__slhNotif(" + ok + ")");
              } else if (req == REQ_SLEEP) {
                js("window.__chlSleepPerm&&__chlSleepPerm(" + ok + ")");
              } else if (req == REQ_BT) {
                js("window.__chlBtPerm&&__chlBtPerm(" + ok + ")");
              } else if (req == REQ_SMS) {
                js("window.__smsPerm&&__smsPerm(" + ok + ")");
              }
            }

            private void js(String code) { web.evaluateJavascript("try{" + code + "}catch(e){}", null); }

            @Override
            public void onBackPressed() {
              web.evaluateJavascript("(window.__onBack&&window.__onBack())?'1':'0'", v -> {
                if (!"\"1\"".equals(v)) finish();
              });
            }
          }
          X

      - name: Build APK
        env:
          RUSHD_KEY_PASS: ${{ secrets.RUSHD_KEY_PASS }}
        run: |
          if [ -z "$RUSHD_KEY_PASS" ]; then echo "::error::RUSHD_KEY_PASS secret is missing; refusing to build"; exit 1; fi
          cd android
          gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Mizaniyati.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: رُشد ${{ github.run_number }}
          files: Mizaniyati.apk
          make_latest: true
