                  if (ok(a, "android.permission.health.READ_EXERCISE"))
                    hc.aggregateGroupByPeriod(new AggregateRecordsRequest.Builder<Long>(f).addAggregationType(ExerciseSessionRecord.EXERCISE_DURATION_TOTAL).build(), Period.ofDays(1), a.getMainExecutor(),
                      new OutcomeReceiver<List<AggregateRecordsGroupedByPeriodResponse<Long>>, HealthConnectException>() {
                        @Override public void onResult(List<AggregateRecordsGroupedByPeriodResponse<Long>> r) {
                          JSONObject o = new JSONObject();
                          for (AggregateRecordsGroupedByPeriodResponse<Long> g : r) { Long v = g.get(ExerciseSessionRecord.EXERCISE_DURATION_TOTAL); try { o.put(g.getStartTime().toLocalDate().toString(), v == null ? 0L : (long) v); } catch (Exception e) { } }
                          a.js("window.__chlHealth&&__chlHealth('exm'," + o + ")");
                        }
                        @Override public void onError(HealthConnectException e) { }
                      });
                  if (ok(a, "android.permission.health.READ_ACTIVE_CALORIES_BURNED"))
                    energy(a, hc, f, ActiveCaloriesBurnedRecord.ACTIVE_CALORIES_TOTAL, "cal");
                  if (ok(a, "android.permission.health.READ_NUTRITION"))
                    energy(a, hc, f, NutritionRecord.ENERGY_TOTAL, "kin");
                  if (ok(a, "android.permission.health.READ_EXERCISE")) {
                    ReadRecordsRequestUsingFilters<ExerciseSessionRecord> req = new ReadRecordsRequestUsingFilters.Builder<>(ExerciseSessionRecord.class).setTimeRangeFilter(f).setPageSize(1000).build();
                    hc.readRecords(req, a.getMainExecutor(), new OutcomeReceiver<ReadRecordsResponse<ExerciseSessionRecord>, HealthConnectException>() {
                      @Override public void onResult(ReadRecordsResponse<ExerciseSessionRecord> r) {
                        JSONArray l = new JSONArray();
                        for (ExerciseSessionRecord s : r.getRecords()) {
                          long m = Math.round((s.getEndTime().toEpochMilli() - s.getStartTime().toEpochMilli()) / 60000.0);
                          String d = s.getStartTime().atZone(ZoneId.systemDefault()).toLocalDate().toString();
                          l.put(new JSONArray().put(d).put(typeName(s.getExerciseType())).put(m));
                        }
                        try { a.js("window.__chlHealth&&__chlHealth('exs'," + new JSONObject().put("list", l) + ")"); } catch (Exception e) { }
                      }
                      @Override public void onError(HealthConnectException e) { }
                    });
                  }
                } catch (Exception e) { }
              }

              static void energy(final MainActivity a, HealthConnectManager hc, LocalTimeRangeFilter f, final AggregationType<Energy> t, final String key) {
                hc.aggregateGroupByPeriod(new AggregateRecordsRequest.Builder<Energy>(f).addAggregationType(t).build(), Period.ofDays(1), a.getMainExecutor(),
                  new OutcomeReceiver<List<AggregateRecordsGroupedByPeriodResponse<Energy>>, HealthConnectException>() {
