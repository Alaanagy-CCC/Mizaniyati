                    hc.aggregateGroupByPeriod(new AggregateRecordsRequest.Builder<Long>(f).addAggregationType(StepsRecord.STEPS_COUNT_TOTAL).build(), Period.ofDays(1), a.getMainExecutor(),
                      new OutcomeReceiver<List<AggregateRecordsGroupedByPeriodResponse<Long>>, HealthConnectException>() {
                        @Override public void onResult(List<AggregateRecordsGroupedByPeriodResponse<Long>> r) {
                          JSONObject o = new JSONObject();
                          for (AggregateRecordsGroupedByPeriodResponse<Long> g : r) { Long v = g.get(StepsRecord.STEPS_COUNT_TOTAL); if (v != null) try { o.put(g.getStartTime().toLocalDate().toString(), (long) v); } catch (Exception e) { } }
                          a.js("window.__chlHealth&&__chlHealth('stp'," + o + ")");
