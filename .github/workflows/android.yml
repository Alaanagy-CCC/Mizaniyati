          base64 -d ks.b64 > android/app/release.p12

          cat > android/settings.gradle <<'X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Mizaniyati"
          include ':app'
          X

          cat > android/build.gradle <<'X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          X

          cat > android/gradle.properties <<'X'
          org.gradle.jvmargs=-Xmx2g
          X

          cat > android/app/build.gradle <<'X'
          plugins { id 'com.android.application' }
          def vc = (project.findProperty('vc') ?: '1') as Integer
          android {
            namespace 'com.mizaniyati.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.mizaniyati.app'
              minSdk 29
              targetSdk 34
              versionCode vc
              versionName "1." + vc
            }
            signingConfigs {
              release {
                storeFile file('release.p12')
                storeType 'pkcs12'
                storePassword 'mizaniyati2026'
                keyAlias 'mizaniyati'
                keyPassword 'mizaniyati2026'
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
            lint {
              abortOnError false
              checkReleaseBuilds false
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          X

          cat > $A/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.USE_BIOMETRIC" />
            <application
                android:label="ميزانيتي"
                android:icon="@mipmap/ic_launcher"
                android:allowBackup="true"
                android:supportsRtl="true"
                android:theme="@style/AppTheme">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          X

          cat > $A/res/values/styles.xml <<'X'
          <resources>
            <style name="AppTheme" parent="android:Theme.DeviceDefault.DayNight">
              <item name="android:windowActionBar">false</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#0F3F45</item>
            </style>
          </resources>
          X

          cat > $A/java/com/mizaniyati/app/MainActivity.java <<'X'
          package com.mizaniyati.app;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.CancellationSignal;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
            private static final int REQ_OPEN = 1, REQ_SAVE = 2;
            private WebView web;
            private ValueCallback<Uri[]> fileCb;
            private String pendingText;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().setStatusBarColor(Color.parseColor("#0F3F45"));
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("file".equals(u.getScheme())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  try { startActivityForResult(Intent.createChooser(i, "اختر ملفاً"), REQ_OPEN); }
                  catch (Exception e) { fileCb = null; return false; }
                  return true;
                }
              });
              web.addJavascriptInterface(new Bridge(), "AndroidBridge");
              web.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onPause() { super.onPause(); if (web != null) web.onPause(); }

            @Override
            protected void onResume() { super.onResume(); if (web != null) web.onResume(); }

            class Bridge {
              @JavascriptInterface
              public boolean canAuth() {
                KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                return km != null && km.isDeviceSecure();
              }

              @JavascriptInterface
              public void authenticate() {
                runOnUiThread(() -> {
                  try {
                    BiometricPrompt.Builder pb = new BiometricPrompt.Builder(MainActivity.this)
                        .setTitle("ميزانيتي")
                        .setSubtitle("افتح التطبيق بالبصمة أو قفل الجهاز");
                    if (Build.VERSION.SDK_INT >= 30) {
                      pb.setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK | BiometricManager.Authenticators.DEVICE_CREDENTIAL);
                    } else {
                      pb.setDeviceCredentialAllowed(true);
                    }
                    pb.build().authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {
                      @Override
                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) { js("window.__authOk&&__authOk()"); }
                      @Override
                      public void onAuthenticationError(int code, CharSequence msg) { js("window.__authFail&&__authFail()"); }
                    });
                  } catch (Exception e) {
                    js("window.__authFail&&__authFail()");
                  }
                });
              }

              @JavascriptInterface
              public void saveFile(final String name, final String mime, final String text) {
                runOnUiThread(() -> {
                  pendingText = text;
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(mime);
                  i.putExtra(Intent.EXTRA_TITLE, name);
                  try { startActivityForResult(i, REQ_SAVE); } catch (Exception e) { pendingText = null; }
                });
              }
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              Uri uri = (res == RESULT_OK && data != null) ? data.getData() : null;
              if (req == REQ_OPEN) {
                if (fileCb != null) { fileCb.onReceiveValue(uri != null ? new Uri[]{uri} : null); fileCb = null; }
              } else if (req == REQ_SAVE) {
                if (uri != null && pendingText != null) {
                  try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                    os.write(pendingText.getBytes(StandardCharsets.UTF_8));
                    js("window.__saved&&__saved();window.__toast&&__toast('تم حفظ الملف')");
                  } catch (Exception e) {
                    js("window.__toast&&__toast('تعذّر حفظ الملف')");
                  }
                }
                pendingText = null;
              }
            }

            private void js(String code) { web.evaluateJavascript("try{" + code + "}catch(e){}", null); }

            @Override
            public void onBackPressed() {
              web.evaluateJavascript("(window.__onBack&&window.__onBack())?'1':'0'", v -> {
                if (!"\"1\"".equals(v)) finish();
              });
            }
          }
          X

      - name: Build APK
        run: |
          cd android
          gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Mizaniyati.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ميزانيتي ${{ github.run_number }}
          files: Mizaniyati.apk
          make_latest: true
