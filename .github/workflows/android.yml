name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          A=android/app/src/main
          mkdir -p $A/java/com/mizaniyati/app $A/assets $A/res/mipmap-xxxhdpi $A/res/values $A/res/drawable $A/res/xml
          cp index.html manifest.json icon-192.png $A/assets/
          cp icon-512.png $A/res/mipmap-xxxhdpi/ic_launcher.png

          cp keys/rushd-release.p12 android/app/release.p12

          cat > android/settings.gradle <<'X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Mizaniyati"
          include ':app'
          X

          cat > android/build.gradle <<'X'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          X

          cat > android/gradle.properties <<'X'
          org.gradle.jvmargs=-Xmx2g
          X

          cat > android/app/build.gradle <<'X'
          plugins { id 'com.android.application' }
          def vc = (project.findProperty('vc') ?: '1') as Integer
          android {
            namespace 'com.mizaniyati.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.mizaniyati.app'
              minSdk 29
              targetSdk 34
              versionCode vc
              versionName "1." + vc
            }
            signingConfigs {
              release {
                storeFile file('release.p12')
                storeType 'pkcs12'
                storePassword System.getenv('RUSHD_KEY_PASS')
                keyAlias 'rushd'
                keyPassword System.getenv('RUSHD_KEY_PASS')
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
            lint {
              abortOnError false
              checkReleaseBuilds false
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          X

          cat > $A/AndroidManifest.xml <<'X'
