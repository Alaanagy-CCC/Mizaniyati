name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          A=android/app/src/main
          mkdir -p $A/java/com/mizaniyati/app $A/assets $A/res/mipmap-xxxhdpi $A/res/values
          cp index.html manifest.json icon-192.png $A/assets/
          cp icon-512.png $A/res/mipmap-xxxhdpi/ic_launcher.png

          cat > ks.b64 <<'KEY'
          MIIEGAIBAzCCA8IGCSqGSIb3DQEHAaCCA7MEggOvMIIDqzCCATIGCSqGSIb3DQEHAaCCASMEggEf
          MIIBGzCCARcGCyqGSIb3DQEMCgECoIG9MIG6MGYGCSqGSIb3DQEFDTBZMDgGCSqGSIb3DQEFDDAr
          BBSYlRdBrDAYo3cG5JsVuhi8aU3YTQICJxACASAwDAYIKoZIhvcNAgkFADAdBglghkgBZQMEASoE
          EDdEYgaiQKFPJMXLE+D+Df0EUAtuhHwzyeoes2h8sHM8Vg1wWs5FsuJOcUUTfMVuZXC1j/trrRkC
          Qewu2Ye5/6dYI7e3CuCIZXVefoRgnaW/rvF9Xhi1eWKk7N4iPdJB1af+MUgwIwYJKoZIhvcNAQkU
          MRYeFABtAGkAegBhAG4AaQB5AGEAdABpMCEGCSqGSIb3DQEJFTEUBBJUaW1lIDE3OTA1NzM1Mjgz
          OTQwggJxBgkqhkiG9w0BBwagggJiMIICXgIBADCCAlcGCSqGSIb3DQEHATBmBgkqhkiG9w0BBQ0w
          WTA4BgkqhkiG9w0BBQwwKwQUwNX71HmcubeObNbg95eBWsJGGnICAicQAgEgMAwGCCqGSIb3DQIJ
          BQAwHQYJYIZIAWUDBAEqBBA3mtNiC3g+3MR5isrC8uRrgIIB4GEhYHD0BDboLdwqMFe0W8h19AVm
          qfvj43mnTxswy59TUGmgDzG0dE3eX4E/bYdRgvnL3Ir2H669djOrXx8HPRpV3d7pJNkS5EbIifVQ
          yhSHAfUYgo/45AW21w3iJ3ipItPn4jGIzKN60UMWSsoXJR/bqhDlreh0mQLNYxGSygv7BRgqR4Qh
          DzEm2LS8/EaZ0qfd/x07RsXJuJEXSCdt2uFli+rBtjBKQipuRSCUdgKFYjJyHihxksAPfEAasSK+
          7BKU3LJzS0+o3sSISNXdmE23nrL1vknYiW3wVsDhq/f5EfP8DDXhkNuL7s4uAIDOe28EeJBSxrUs
          rrKTa9bhDOU9pkz6+1J0j7ukusYGoW6tPLgg+qs3xcnP074u90MkDO9kBuUFpHZmqjVQOxKl5MYz
          Xdoa3YSGFa4wRPjXzxoOgTDiQ7WiIxQS94X+VAbs84ejaj5xJH/gWDSQjRzeRnh12FKTAWemtKd2
          U/gFi9wsa1L1Die4CORwsYkqKaLt/uAx6N8UYDwQ4fMZLK7BpOJ6/1aOGNS94mmSsTf99lMS5wRU
          Sq48SOvxaIG53APsjD4T189Eq5D6poocZP8AdMRLG2ZUovnrK2N0zbGlTkDST7KZF13PvDvjiGB8
