            static class SleepReader {
              static void read(final MainActivity a, long start, long end) {
                try {
                  HealthConnectManager hc = a.getSystemService(HealthConnectManager.class);
                  ReadRecordsRequestUsingFilters<SleepSessionRecord> req = new ReadRecordsRequestUsingFilters.Builder<>(SleepSessionRecord.class)
                      .setTimeRangeFilter(new TimeInstantRangeFilter.Builder().setStartTime(Instant.ofEpochMilli(start)).setEndTime(Instant.ofEpochMilli(end)).build())
                      .setPageSize(1000)
                      .build();
                  hc.readRecords(req, a.getMainExecutor(), new OutcomeReceiver<ReadRecordsResponse<SleepSessionRecord>, HealthConnectException>() {
                    @Override
                    public void onResult(ReadRecordsResponse<SleepSessionRecord> r) {
                      JSONArray out = new JSONArray();
                      for (SleepSessionRecord s : r.getRecords()) {
                        long st = s.getStartTime().toEpochMilli(), en = s.getEndTime().toEpochMilli(), aw = 0;
                        for (SleepSessionRecord.Stage g : s.getStages()) {
                          int ty = g.getType();
                          if (ty == SleepSessionRecord.StageType.STAGE_TYPE_AWAKE || ty == SleepSessionRecord.StageType.STAGE_TYPE_AWAKE_IN_BED || ty == SleepSessionRecord.StageType.STAGE_TYPE_AWAKE_OUT_OF_BED)
                            aw += g.getEndTime().toEpochMilli() - g.getStartTime().toEpochMilli();
                        }
                        out.put(new JSONArray().put(st).put(en).put(aw));
                      }
                      a.js("window.__chlSleep&&__chlSleep(" + out + ")");
                    }

                    @Override
                    public void onError(HealthConnectException e) {
                      a.js("window.__chlSleep&&__chlSleep(null)");
                    }
                  });
                } catch (Exception e) {
                  a.js("window.__chlSleep&&__chlSleep(null)");
                }
              }
            }

