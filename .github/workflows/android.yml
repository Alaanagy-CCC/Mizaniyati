            private void regCompass() {
              if (sm == null) sm = (SensorManager) getSystemService(SENSOR_SERVICE);
              Sensor rv = sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);
              if (rv == null) { js("window.__slhAcc&&__slhAcc(-1)"); return; }
              sm.unregisterListener(sensL);
              sm.registerListener(sensL, rv, SensorManager.SENSOR_DELAY_GAME);
              Sensor mg = sm.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);
              if (mg != null) sm.registerListener(sensL, mg, SensorManager.SENSOR_DELAY_UI);
